# nginx.conf
server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  charset utf-8;

  location / {
    try_files $uri $uri/ /index.html -404;
  }
}
server {
    listen 80;
    server_name localhost; # Cambia esto

    root /user/share/nginx/html; # Ruta a tus archivos de build
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html -404;
    }
}
