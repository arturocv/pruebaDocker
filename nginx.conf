# nginx.conf
server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html index.htm;

  location ~* .(eot|ttf|woff|woff2)$ {
    add_header Access-Control-Allow-Origin *;
  }

  location / {
    proxy_pass http://localhost:4000;
    try_files $uri $uri/ =404;
  }
}
